<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarGuardian Analytics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 40px;
        }

        .card {
            width: 420px;
            background: #1e293b;
            border-radius: 18px;
            padding: 45px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
        }

        h1 {
            margin-bottom: 20px;
            font-size: 30px;
        }

        p {
            color: #cbd5e1;
            line-height: 28px;
        }

        .loader {
            margin: 35px auto;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 5px solid #334155;
            border-top: 5px solid #06b6d4;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
<div class="card">
    <h1>CarGuardian</h1>
    <p id="status">Localizando servidor...</p>
    <div class="loader"></div>
</div>

<script>
(async () => {
    //-----------------------------------------------------
    // Obtener Device ID
    //-----------------------------------------------------
    const params = new URLSearchParams(window.location.search);
    const device = params.get("device");

    if (!device) {
        document.getElementById("status").innerHTML = "No se recibió el Device ID.";
        return;
    }

    //-----------------------------------------------------
    // Leer server.json
    //-----------------------------------------------------
    try {
        const response = await fetch("/config/server.json?" + Date.now());

        if (!response.ok) {
            throw new Error("No fue posible leer server.json");
        }

        const server = await response.json();

        //-------------------------------------------------
        // URL pública
        //-------------------------------------------------
        const backend = server.server.url;

        if (!backend) {
            throw new Error("No existe la URL del servidor.");
        }

        //-------------------------------------------------
        // Redireccionar
        //-------------------------------------------------
        window.location.replace(
            backend + "/activate.html?device=" + encodeURIComponent(device)
        );

    } catch (error) {
        console.error(error);
        document.getElementById("status").innerHTML = "No fue posible localizar el servidor.";
    }
})();
</script>
</body>
</html>
