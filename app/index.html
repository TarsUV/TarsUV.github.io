<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarGuardian Analytics</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CarGuardian">
    <link rel="apple-touch-icon" href="logo_carGuardian.png">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 40px;
        }

        .card {
            width: 420px;
            background: #1e293b;
            border-radius: 18px;
            padding: 45px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
        }

        .logo {
            width: 90px;
            margin-bottom: 25px;
        }

        h1 {
            margin-bottom: 12px;
            font-size: 28px;
        }

        p {
            color: #cbd5e1;
            line-height: 26px;
            margin-bottom: 18px;
        }

        .loader {
            margin: 30px auto 10px;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 5px solid #334155;
            border-top: 5px solid #06b6d4;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 28px;
            background: #06b6d4;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
        }

        .btn:hover {
            background: #0891b2;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="logo_carGuardian.png" alt="CarGuardian" class="logo">
        <h1>CarGuardian</h1>
        <p id="status">Localizando servidor...</p>
        <div id="loader" class="loader"></div>
        <button id="retryBtn" class="btn hidden" onclick="start()">Reintentar</button>
    </div>

    <script>
        // Registrar Service Worker
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("service-worker.js")
                .then(() => console.log("Service Worker registrado"))
                .catch(err => console.error("Error SW:", err));
        }

        const statusEl = document.getElementById("status");
        const loaderEl = document.getElementById("loader");
        const retryBtn = document.getElementById("retryBtn");

        async function start() {
            statusEl.innerHTML = "Localizando servidor...";
            loaderEl.classList.remove("hidden");
            retryBtn.classList.add("hidden");

            try {
                // 1. Leer server.json
                const configRes = await fetch("/config/server.json?" + Date.now());
                if (!configRes.ok) throw new Error("No se pudo leer server.json");

                const config = await configRes.json();
                const backend = (config.server?.url || config.url || "").replace(/\/$/, "");

                if (!backend) throw new Error("No se encontró la URL del servidor");

                console.log("Servidor detectado:", backend);

                // 2. Comprobar que el backend esté vivo
                statusEl.innerHTML = "Verificando conexión...";

                const healthRes = await fetch(backend + "/health", {
                    method: "GET",
                    signal: AbortSignal.timeout(6000) // 6 segundos máximo
                });

                if (!healthRes.ok) throw new Error("El servidor no responde");

                // 3. ¿Hay sesión?
                const user = localStorage.getItem("user");
                const vehicle = localStorage.getItem("vehicle");

                let destination;

                if (user && vehicle) {
                    // Ya tiene sesión → Dashboard
                    destination = backend + "/pages/dashboard.html";
                } else {
                    // No hay sesión → Login
                    destination = backend + "/pages/login.html";
                }

                statusEl.innerHTML = "Conectando...";
                window.location.replace(destination);

            } catch (error) {
                console.error(error);
                loaderEl.classList.add("hidden");
                statusEl.innerHTML = "Servidor fuera de línea.<br>Intenta nuevamente en unos segundos.";
                retryBtn.classList.remove("hidden");
            }
        }

        // Iniciar automáticamente
        start();
    </script>
</body>
</html>
