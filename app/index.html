<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarGuardian Analytics</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CarGuardian">
    <link rel="apple-touch-icon" href="logo_carGuardian.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 40px;
        }

        .card {
            width: 420px;
            background: #1e293b;
            border-radius: 18px;
            padding: 45px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
        }

        .logo {
            width: 90px;
            margin-bottom: 25px;
        }

        h1 {
            margin-bottom: 12px;
            font-size: 28px;
        }

        p {
            color: #cbd5e1;
            line-height: 26px;
            margin-bottom: 10px;
        }

        .loader {
            margin: 35px auto 10px;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 5px solid #334155;
            border-top: 5px solid #06b6d4;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="logo_carGuardian.png" alt="CarGuardian" class="logo">
        <h1>CarGuardian</h1>
        <p id="status">Localizando servidor...</p>
        <div class="loader"></div>
    </div>

    <script>
        // Registrar Service Worker
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("service-worker.js")
                .then(() => console.log("Service Worker registrado"))
                .catch(err => console.error("Error SW:", err));
        }

        (async () => {
            const status = document.getElementById("status");

            try {
                // Leer server.json (con cache-busting)
                const response = await fetch("/config/server.json?" + Date.now());

                if (!response.ok) {
                    throw new Error("No fue posible leer server.json");
                }

                const config = await response.json();
                const backend = config.server?.url || config.url;

                if (!backend) {
                    throw new Error("No se encontró la URL del servidor");
                }

                console.log("Servidor detectado:", backend);

                // Redirigir al login del backend
                const destination = backend.replace(/\/$/, "") + "/pages/login.html";
                status.innerHTML = "Conectando...";

                window.location.replace(destination);

            } catch (error) {
                console.error(error);
                status.innerHTML = "No fue posible localizar el servidor.<br>Intenta más tarde.";
            }
        })();
    </script>
</body>
</html>
